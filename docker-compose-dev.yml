version: "3.9"

services:
  backend:
    image: aryadeb1234/attendence-app:v1.1
    build: .
    container_name: backend-dev
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - .:/app                # Links your current folder to the /app folder in Docker
      - /app/node_modules     # This is an "Anonymous Volume" - it protects the container's modules
    command: npm run dev      # This forces the container to use nodemon instead of the default start
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7
    container_name: mongo-dev
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express-dev2
    restart: always
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=password
      - ME_CONFIG_MONGODB_URL=mongodb://admin:password@mongo:27017/
    depends_on:
      - mongo

volumes:
  mongo_data:
